worker_processes auto;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  # Compressão gzip para respostas JSON e texto
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1000;
  gzip_types
    application/json
    application/javascript
    text/plain
    text/css;

  # Keep-alive com upstream Node.js
  upstream backend {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;

    # Ocultar versão do Nginx em respostas de erro
    server_tokens off;

    # Timeouts
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     65s;

    # Limite de tamanho de payload (ex: upload de imagem de livro)
    client_max_body_size 10m;

    location /api {
      proxy_pass         http://backend;
      proxy_http_version 1.1;

      # Habilita keep-alive entre Nginx e Node
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Buffer de resposta: libera o Node assim que termina de gerar a resposta
      proxy_buffering        on;
      proxy_buffer_size      16k;
      proxy_buffers          8 16k;

      # Timeouts de proxy
      proxy_connect_timeout  5s;
      proxy_send_timeout     30s;
      proxy_read_timeout     30s;
    }

    # Health check direto no Nginx (não passa pelo Node)
    location /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
