services:
  chromadb:
    image: chromadb/chroma
    container_name: ecm_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=*
      - ANONYMIZED_TELEMETRY=False
    networks:
      - ecm_network

  postgres:
    image: postgres:16-alpine
    container_name: ecm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecm_livraria}
      POSTGRES_USER: ${POSTGRES_USER:-ecm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecm_senha}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecm_user -d ecm_livraria"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - ecm_network

  app:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: ecm_app
    restart: unless-stopped
    # Roda tini como PID 1: sem um init, o ts-node-dev vira PID 1 e não consegue
    # matar/reapear o processo filho, travando o respawn (hot-reload) no restart.
    init: true
    # Hot-reload sob bind mount: inotify não propaga eventos host→container, e o
    # respawn do ts-node-dev é instável nesse cenário. Usamos nodemon com
    # --legacy-watch (polling incondicional), que reinicia de forma confiável.
    command: npm run dev:docker
    ports:
      # host:container — valores em .env (PORTA_HTTP_EXTERNA / PORTA_HTTP)
      - "${PORTA_HTTP_EXTERNA:-3002}:${PORTA_HTTP:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORTA_HTTP||'3000';require('http').get('http://127.0.0.1:'+p+'/api',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      - NODE_ENV=development
      - DEFAULT_LOJA_ID=1
      - MULTI_TENANCY_ENABLED=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ecm_user
      - POSTGRES_PASSWORD=ecm_senha
      - POSTGRES_DB=ecm_livraria
      - CHROMADB_HOST=http://chromadb:8000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - ecm_network

networks:
  ecm_network:
    driver: bridge

volumes:
  postgres_data:
  chromadb_data:

